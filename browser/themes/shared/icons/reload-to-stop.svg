    <path d="M4.5 4.5 L15.5 15.5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" opacity="0.5"/>
    <path d="M15.5 4.5 L4.5 15.5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" opacity="0.5"/>
  </g>

  <!-- Frames 10–13: Full X -->
