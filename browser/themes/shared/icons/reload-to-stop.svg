    <path d="M4.5 4.5 L15.5 15.5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M15.5 4.5 L4.5 15.5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
  </g>
  <g transform="translate(200,0)">
    <path d="M4.5 4.5 L15.5 15.5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M15.5 4.5 L4.5 15.5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
  </g>

</svg>