    <path d="M12 2.5 L12 5.5 L9.5 5.5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
  </g>
  <g transform="translate(20,0)">
    <path d="M13.5 8a5.5 5.5 0 1 1-1.5-3.8" stroke="currentColor" stroke-width="2.2"/>
    <path d="M12 2.5 L12 5.5 L9.5 5.5" stroke="currentColor" stroke-width="2.2"/>
  </g>

  <!-- Transition -->
  <g transform="translate(120,0)">
